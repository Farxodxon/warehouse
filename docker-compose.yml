# WMS backend — lokal ishlash uchun.
#
# Postgres konteynerini ko'tarish:
#   docker compose up -d
# Migratsiyalar:
#   dart run bin/migrate.dart
# Server:
#   dart run bin/server.dart

services:
  postgres:
    image: postgres:18-alpine
    container_name: wms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms_local_dev
      POSTGRES_DB: wms
    ports:
      - "5432:5432"
    volumes:
      - wms_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Nom aniq belgilanadi: compose o'zi avtomatik "warehouse_" prefiksi qo'shadi,
  # natijada ma'lumotli volume'ga ulanib bo'lmaydi.
  wms_pgdata:
    name: wms_pgdata