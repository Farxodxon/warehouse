# Render production service.
# Backend: https://eclair-wms-app.onrender.com
# Database: Neon PostgreSQL (DATABASE_URL is set in the Render dashboard).
services:
  - type: web
    name: eclair-wms-app
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 8080
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
